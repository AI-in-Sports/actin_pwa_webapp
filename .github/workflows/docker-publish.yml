name: Publish production image

# Every push to main is a release: this includes PR merges and local
# "git merge development && git push origin main" flows. workflow_dispatch is
# there for rebuilding the current main commit by hand.
on:
  push:
    branches: [main]
    # The image rebuild commits the rendered compose file back to main. Skip
    # that commit so the workflow cannot trigger itself.
    paths-ignore:
      - docker_compose.prod.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Defaults to GitHub Container Registry. To publish to another registry set
  # the repository variables REGISTRY, IMAGE_NAME and REGISTRY_USERNAME plus the
  # REGISTRY_PASSWORD secret.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  build-and-push:
    name: Build, push and pin the production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_BACKEND: ${{ vars.APP_BACKEND || 'https://api.actinhealth.ir' }}
      DISABLE_RESERVATION: ${{ vars.DISABLE_RESERVATION || 'false' }}
    steps:
      - name: Registry access is configured
        env:
          NPM_ACTIN_TOKEN: ${{ secrets.NPM_ACTIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$NPM_ACTIN_TOKEN" ]; then
            echo "::error::No token is available to read @ai-in-sports/actin-pwa-layer."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        run: echo "name=${REGISTRY,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # latest only moves on main, so manual builds cannot overwrite it.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Actin PWA webapp
            org.opencontainers.image.description=Actin Health member PWA (Nuxt 4, Node server)

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Production hosts are linux/amd64. Add docker/setup-qemu-action before
          # this step if you ever switch to linux/arm64 (or multi-arch).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BACKEND=${{ env.APP_BACKEND }}
            DISABLE_RESERVATION=${{ env.DISABLE_RESERVATION }}
            NODE_MAX_OLD_SPACE_SIZE=8192
          secrets: |
            npm_token=${{ secrets.NPM_ACTIN_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Pin the built image in docker_compose.prod.yml
        # Only a main build is a release; a manual build on a branch must not
        # change the default image in the committed compose file.
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          # Rewrite the default inside ${WEBAPP_IMAGE:-...}. The override variable
          # and the rest of the file stay untouched. Example result:
          #   image: ${WEBAPP_IMAGE:-ghcr.io/acme/app:sha-1234567}
          sed -i -E 's#\$\{WEBAPP_IMAGE:-[^}]*\}#${WEBAPP_IMAGE:-'"${IMAGE}:${TAG}"'}#' docker_compose.prod.yml
          echo "Rendered image reference:"
          grep -n "image:" docker_compose.prod.yml

      - name: Upload the rendered compose file
        uses: actions/upload-artifact@v4
        with:
          name: docker_compose.prod
          path: docker_compose.prod.yml

      - name: Commit the rendered compose file
        run: |
          if git diff --quiet -- docker_compose.prod.yml; then
            echo "docker_compose.prod.yml is already pinned to this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker_compose.prod.yml
          git commit -m "chore: pin production image to ${GITHUB_SHA::7} [skip ci]"
          git push || echo "::warning::Could not push the rendered compose file (branch protection?). Download the docker_compose.prod artifact instead."


      - name: Publish summary
        run: |
          {
            echo "### Production image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.name }}\` |"
            echo "| Tags | \`$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "Deploy that exact build with:"
            echo '```bash'
            echo "WEBAPP_IMAGE=${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7} \\"
            echo "  docker compose -f docker_compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
