name: CI

on:
  pull_request:
  push:
    # main is covered by docker-publish.yml, which builds the release image.
    branches: [development]

permissions:
  contents: read
  packages: read

env:
  # Nuxt 4 / Vite 8 builds are heavier than the old stack; keep headroom.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_ACTIN_TOKEN: ${{ secrets.NPM_ACTIN_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NPM_ACTIN_TOKEN}" >> "$HOME/.npmrc"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - name: Shell tests, and the Android build compiles
        working-directory: mobile/src-tauri
        run: |
          mkdir -p ../.output/public
          cargo test --locked
          cargo check --locked --target aarch64-linux-android

  mobile:
    # The member app in mobile/ (Tauri v2 for iOS and Android): unit tests, types and the web build.
    needs: mobile-shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NPM_ACTIN_TOKEN: ${{ secrets.NPM_ACTIN_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NPM_ACTIN_TOKEN}" >> "$HOME/.npmrc"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Generate static app
        run: pnpm generate
