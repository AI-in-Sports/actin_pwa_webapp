name: CI

on:
  pull_request:
  push:
    # main is covered by docker-publish.yml, which builds the release image.
    branches: [development]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read token for the @actin registry (packages.actinhealth.ir), set under
      # Settings > Secrets and variables > Actions.
      NPM_ACTIN_TOKEN: ${{ secrets.NPM_ACTIN_TOKEN }}
    steps:
      - name: Registry token is configured
        run: |
          if [ -z "$NPM_ACTIN_TOKEN" ]; then
            echo "::error::Add the NPM_ACTIN_TOKEN repository secret (read token for packages.actinhealth.ir)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  mobile:
    # The member app in mobile/ (Tauri v2 for iOS and Android): unit tests, types and the web build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Read token for the private AI-in-Sports/actin-pwa-layer repository (same secret as the dashboard).
      ACTIN_LAYER_TOKEN: ${{ secrets.ACTIN_LAYER_TOKEN }}
    steps:
      - name: Layer token is configured
        run: |
          if [ -z "$ACTIN_LAYER_TOKEN" ]; then
            echo "::error::Add the ACTIN_LAYER_TOKEN repository secret (read access to AI-in-Sports/actin-pwa-layer)."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Let git reach the private layer
        run: |
          TOKEN_URL="https://x-access-token:${ACTIN_LAYER_TOKEN}@github.com/"
          git config --global url."$TOKEN_URL".insteadOf "git@github.com:"
          git config --global --add url."$TOKEN_URL".insteadOf "https://github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm generate

  mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - name: Shell tests, and the Android build compiles
        working-directory: mobile/src-tauri
        run: |
          mkdir -p ../.output/public
          cargo test --locked
          cargo check --locked --target aarch64-linux-android
